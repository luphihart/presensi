<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#fav-grad)" />
  
  <!-- Subtle inner ambient circle -->
  <circle cx="256" cy="256" r="180" fill="white" fill-opacity="0.06" />

  <!-- Fingerprint Icon -->
  <g fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Outer Arc -->
    <path d="M 160 270 C 160 180, 352 180, 352 270 C 352 330, 320 370, 320 400" opacity="0.9" />
    <!-- Middle Arc -->
    <path d="M 196 270 C 196 210, 316 210, 316 270 C 316 330, 288 360, 288 410" stroke-width="22" opacity="0.95" />
    <!-- Inner Loop -->
    <path d="M 232 270 C 232 240, 280 240, 280 270 C 280 320, 256 350, 256 420" stroke-width="20" />
    <!-- Center Core Dot -->
    <circle cx="256" cy="270" r="10" fill="white" stroke="none" />
  </g>

  <!-- Top Right Checkmark Badge -->
  <circle cx="370" cy="142" r="44" fill="#22C55E" stroke="url(#fav-grad)" stroke-width="12" />
  <path d="M 350 142 L 364 156 L 392 128" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
